<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 220" role="img" aria-label="ChanLog logo">
  <defs>
    <linearGradient id="cl-bg" x1="20" y1="10" x2="190" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#15202B"/>
      <stop offset="100%" stop-color="#0B1218"/>
    </linearGradient>
    <linearGradient id="cl-mark" x1="60" y1="50" x2="160" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#0D9488"/>
