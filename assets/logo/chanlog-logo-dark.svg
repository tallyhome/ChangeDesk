    <path d="M86 110h46" stroke-width="12"/>
    <path d="M86 144h34" stroke-width="12"/>
  </g>

  <!-- Wordmark (light for dark backgrounds / GitHub dark mode) -->
  <g font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" fill="#F8FAFC">
    <text x="230" y="132" font-size="92" font-weight="700" letter-spacing="-2">ChanLog</text>
  </g>
  <text x="234" y="178" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="500" fill="#94A3B8" letter-spacing="0.5">Changelog · Roadmap · Bugs · Wiki</text>
