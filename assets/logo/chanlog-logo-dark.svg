      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0B1218"/>
    </linearGradient>
    <linearGradient id="cl-mark-d" x1="60" y1="50" x2="160" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5EEAD4"/>
