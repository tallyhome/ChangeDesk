  <g fill="none" stroke="url(#cl-mark-d)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M66 62v116" stroke-width="12"/>
    <circle cx="66" cy="76" r="9" fill="#5EEAD4" stroke="none"/>
    <circle cx="66" cy="110" r="9" fill="#2DD4BF" stroke="none"/>
